<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Guessing Game</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="guess-page">

  <div class="main-container">

    <div class="game-card">
      <div class="icon-circle">🎯</div>

      <h1>Number Guessing Game</h1>
      <p class="subtitle">
        Choose a difficulty level and guess the hidden number before your attempts run out.
      </p>

      <div class="input-group">
        <label for="name">Player Name</label>
        <input id="name" type="text" placeholder="Enter your name">
      </div>

      <div class="input-group">
        <label for="level">Difficulty Level</label>
        <select id="level">
          <option value="easy">Easy - 1 to 50</option>
          <option value="medium">Medium - 1 to 100</option>
          <option value="hard">Hard - 1 to 100</option>
        </select>
      </div>

      <button class="primary-btn" onclick="startGame()">Start Game</button>

      <div class="status-box">
        <p id="range">Range: -</p>
        <p id="msg">Click Start Game to begin</p>
        <p id="attempts">Attempts left: -</p>
      </div>

      <div class="input-group">
        <label for="guess">Your Guess</label>
        <input id="guess" type="number" placeholder="Enter your guess">
      </div>

      <button class="secondary-btn" onclick="sendGuess()">Submit Guess</button>

      <a href="/mind" class="link-btn">Try Mind Reading Game 🧠</a>
    </div>

  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
