<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mind Reading Game</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="mind-page">

  <div class="main-container">

    <div class="game-card">
      <div class="icon-circle">🧠</div>

      <h1>Mind Reading Game</h1>
      <p class="subtitle">
        Think of a number between 1 and 100. The computer will try to read your mind and guess it!
      </p>

      <button class="primary-btn" onclick="startMindGame()">Start Mind Reading</button>

      <div class="status-box mind-status">
        <p id="msg">Think of a number and click start</p>
      </div>

      <div class="button-row">
        <button class="choice-btn" onclick="mindFeedback('high')">Too High</button>
        <button class="correct-btn" onclick="mindFeedback('correct')">Correct!</button>
        <button class="choice-btn" onclick="mindFeedback('low')">Too Low</button>
      </div>

      <a href="/" class="link-btn">Back to Number Guessing 🎯</a>
    </div>

  </div>

  <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
